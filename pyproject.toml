[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-rebalancer"
version = "0.1.0"
description = "Portfolio rebalancing library: target allocations, tolerance bands, transaction costs and point-in-time market context."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
backtest = ["yfinance>=0.2", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["lib"]
include = ["portfolio_rebalancer*"]

[tool.pytest.ini_options]
testpaths = ["lib/tests"]
pythonpath = ["lib"]
